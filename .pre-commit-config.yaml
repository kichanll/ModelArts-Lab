repos:
  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy scripts tests
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint .github/workflows .github/dependabot.yml
        language: system
        pass_filenames: false
