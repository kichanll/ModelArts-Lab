name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "vllm/**"

permissions:
  contents: read

jobs:
  smoke:
    name: Repository smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-lint.txt

      - name: Run tests
        run: python -m pytest
